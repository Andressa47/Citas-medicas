<div class="split-layout">

  <div class="brand-section">
    <div class="medular-login-brand">
  <img
    src="/branding/medular-login.png"
    alt="Medular - Sistema Médico"
    class="medular-login-logo"
  />

  <h2>Sistema Médico</h2>


</div>
  </div>


  <div class="form-section">

    <div class="login-box">

      <h2>Iniciar Sesión</h2>

      <p class="subtitle">
        Ingresa tus credenciales para acceder a tu cuenta
      </p>


      <form
        (ngSubmit)="iniciarSesion()"
        #loginForm="ngForm"
      >

        <div class="input-group">

          <label for="email">
            Usuario
          </label>

          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="credenciales.email"
            required
            placeholder="admin@citas.com"
          >

        </div>


        <div class="input-group">

          <label for="password">
            Contraseña
          </label>

          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="credenciales.password"
            required
            placeholder="••••••••"
          >

        </div>


        <div
          class="error-message"
          *ngIf="mensajeError"
        >
          {{ mensajeError }}
        </div>


        <button
          type="submit"
          [disabled]="!loginForm.form.valid"
        >
          Ingresar al sistema
        </button>

      </form>

    </div>

  </div>

</div>
