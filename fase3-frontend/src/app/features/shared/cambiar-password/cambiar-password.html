<section class="security-card">

  <div class="security-header">

    <div>

      <span class="eyebrow">
        SEGURIDAD
      </span>

      <h3>
        Cambiar contraseña
      </h3>

      <p>
        Actualiza tu contraseña de acceso
        al sistema.
      </p>

    </div>

  </div>


  <div
    class="mensaje success"
    *ngIf="mensaje"
  >
    {{ mensaje }}
  </div>


  <div
    class="mensaje error"
    *ngIf="error"
  >
    {{ error }}
  </div>


  <form
    #passwordForm="ngForm"
    (ngSubmit)="cambiarPassword()"
  >

    <div class="form-group">

      <label for="passwordActual">
        Contraseña actual
      </label>

      <input
        id="passwordActual"
        name="passwordActual"
        type="password"
        required
        [(ngModel)]="
          formulario.passwordActual
        "
        autocomplete="current-password"
      >

    </div>


    <div class="form-grid">

      <div class="form-group">

        <label for="nuevaPassword">
          Nueva contraseña
        </label>

        <input
          id="nuevaPassword"
          name="nuevaPassword"
          type="password"
          required
          minlength="8"
          [(ngModel)]="
            formulario.nuevaPassword
          "
          autocomplete="new-password"
        >

      </div>


      <div class="form-group">

        <label for="confirmarPassword">
          Confirmar nueva contraseña
        </label>

        <input
          id="confirmarPassword"
          name="confirmarPassword"
          type="password"
          required
          minlength="8"
          [(ngModel)]="
            formulario.confirmarPassword
          "
          autocomplete="new-password"
        >

      </div>

    </div>


    <div class="password-help">

      La nueva contraseña debe tener
      al menos 8 caracteres, una letra
      mayúscula, una minúscula, un número
      y un carácter especial.

    </div>


    <div class="actions">

      <button
        type="submit"
        class="primary-button"
        [disabled]="
          guardando ||
          !passwordForm.form.valid
        "
      >

        {{
          guardando
            ? 'Actualizando...'
            : 'Cambiar contraseña'
        }}

      </button>

    </div>

  </form>

</section>
