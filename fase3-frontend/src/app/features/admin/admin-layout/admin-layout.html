<div class="admin-layout">

  <aside class="sidebar">

    <div class="medular-sidebar-brand">
      <img
        src="/branding/medular-horizontal.png"
        alt="Medular"
        class="medular-sidebar-logo"
      />

      <span>Administración</span>
    </div>

    <nav class="sidebar-nav">

      <p class="nav-title">
        GESTIÓN
      </p>

      <a
        routerLink="/admin"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="nav-icon">⌂</span>
        Inicio
      </a>

      <a
        routerLink="/admin/especialidades"
        routerLinkActive="active"
      >
        <span class="nav-icon">✚</span>
        Especialidades
      </a>

      <a
        routerLink="/admin/usuarios"
        routerLinkActive="active"
      >
        <span class="nav-icon">♟</span>
        Usuarios
      </a>

      <a
        routerLink="/admin/medicos"
        routerLinkActive="active"
      >
        <span class="nav-icon">⚕</span>
        Médicos
      </a>

      <a
        routerLink="/admin/horarios"
        routerLinkActive="active"
      >
        <span class="nav-icon">◷</span>
        Horarios
      </a>

      <a
        routerLink="/admin/citas"
        routerLinkActive="active"
      >
        <span class="nav-icon">▦</span>
        Gestión de citas
      </a>

      <a
        routerLink="/admin/credencial-digital"
        routerLinkActive="active"
      >
        <span class="nav-icon"></span>
        Credencial Digital
      </a>

      <a
        routerLink="/admin/seguridad"
        routerLinkActive="active"
      >
        <span class="nav-icon"></span>
        Seguridad
      </a>

    </nav>

    <div class="sidebar-bottom">

      <div class="admin-info">

        <div class="avatar">
          A
        </div>

        <div>
          <strong>
            Administrador
          </strong>

          <span>
            Panel administrativo
          </span>
        </div>

      </div>

      <button
        type="button"
        class="logout-button"
        (click)="cerrarSesion()"
      >
        Cerrar sesión
      </button>

    </div>

  </aside>

  <div class="main-area">

    <header class="topbar">

      <div>

        <p class="topbar-label">
          Sistema de gestión médica
        </p>

        <h1>
          Panel administrativo
        </h1>

      </div>

    </header>

    <main class="page-content">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
